[package]
name = "sharecli"
version = "0.3.0"
edition = "2021"
description = "Shared CLI process manager for multi-project agent orchestration"
license = "MIT"
authors = ["Phenotype"]
repository = "https://github.com/KooshaPari/sharecli"

[package.metadata.dist]
installers = ["cargo-binstall"]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]

[package.metadata.bundle.macos]
identifier = "phenotype.sharecli"
icon = ["assets/icons/sharecli-512x512.png"]
category = "DeveloperTool"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
fs2 = "0.4"
libc = "0.2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# Process management (substrate SDK + adapter)
substrate = { git = "https://github.com/KooshaPari/substrate", default-features = false }
runtime-process = { git = "https://github.com/KooshaPari/substrate", package = "runtime-process" }
sysinfo = "0.39"

# Zig hot core: POSIX semaphore, posix_spawn, setpriority, waitpid
spawn-core-sys = { path = "crates/spawn-core-sys" }

# Fleet: device registry + thermal governor
sharecli-fleet = { path = "crates/sharecli-fleet" }

# Thermal TUI
sharecli-thermal-tui = { path = "crates/sharecli-thermal-tui" }

# Config hot-reload
notify = { version = "8", features = ["serde"] }

# process-compose.yaml parsing
serde_yaml = "0.9"

# Notifications
notify-rust = { version = "4", optional = true }
reqwest = { version = "0.13", features = ["json"], optional = true }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
sha2 = "0.11"

[features]
desktop-notifications = ["notify-rust"]
notifications-http = ["reqwest"]

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["async_tokio", "html_reports"] }

[[bench]]
name = "config_parse"
harness = false

[[bench]]
name = "pool_list"
harness = false

[[bench]]
name = "prometheus_render"
harness = false

# Temporary clippy allow-list so CI `RUSTFLAGS=-D warnings` + `clippy -D warnings`
# can pass while style/pedantic debt is paid down (see audit/CI_TRUTH_FINDINGS.md).
# Do not weaken workflow RUSTFLAGS; re-enable these lints as code is cleaned.
[lints.clippy]
absurd_extreme_comparisons = "allow"
approx_constant = "allow"
bool_assert_comparison = "allow"
doc_lazy_continuation = "allow"
doc_overindented_list_items = "allow"
erasing_op = "allow"
identity_op = "allow"
if_same_then_else = "allow"
inconsistent_digit_grouping = "allow"
int_plus_one = "allow"
large_const_arrays = "allow"
len_without_is_empty = "allow"
len_zero = "allow"
manual_abs_diff = "allow"
manual_div_ceil = "allow"
manual_hash_one = "allow"
manual_inspect = "allow"
manual_is_multiple_of = "allow"
manual_memcpy = "allow"
manual_range_contains = "allow"
manual_repeat_n = "allow"
manual_rotate = "allow"
manual_strip = "allow"
manual_swap = "allow"
mem_replace_with_default = "allow"
needless_bool = "allow"
needless_borrows_for_generic_args = "allow"
needless_lifetimes = "allow"
needless_range_loop = "allow"
new_without_default = "allow"
redundant_closure = "allow"
redundant_pattern_matching = "allow"
replace_box = "allow"
same_item_push = "allow"
should_implement_trait = "allow"
type_complexity = "allow"
unnecessary_cast = "allow"
unnecessary_map_or = "allow"
unused_enumerate_index = "allow"
upper_case_acronyms = "allow"
useless_vec = "allow"
vec_init_then_push = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# The tray is a background helper, not on any hot path — optimize it for size.
[profile.release.package.sharecli-tray-linux]
opt-level = "z"

[workspace]
members = [
    "crates/harness-native",
    "crates/sharecli-ipc",
    "crates/sharecli-ffi",
    "crates/sharecli-tray-linux",
    "crates/sharecli-fleet",
    "crates/spawn-core-sys",
    "crates/sharecli-fuse",
    "crates/sharecli-core",
    "crates/sharecli-thermal-tui",
]

# ---------------------------------------------------------------------------
# cargo-dist release automation
# ---------------------------------------------------------------------------
# This section is consumed by `cargo dist` and the release workflow to
# produce per-platform binaries + installer archives for the CLI and the
# Linux tray.  The macOS Swift tray and Windows WinUI 3 tray are assembled
# by separate steps in the workflow (they are not cargo crates).
[workspace.metadata.dist]
dist = true
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
# Apps built by cargo-dist (all Rust workspace binaries we ship).
# The Swift tray + WinUI 3 tray are added by the workflow.
ci = ["github"]
hosting = ["github"]
app-local = ["sharecli", "sharecli-ipc", "sharecli-tray-linux"]
