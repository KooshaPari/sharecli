name: Build artifacts (soft)

# Soft guard against committed Zig caches / object files under crates/.
# Does not block merges; surfaces OSSF Scorecard Binary-Artifacts regressions early.

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - '.gitignore'
      - 'scripts/check-no-build-artifacts.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-tracked-artifacts:
    name: No tracked build artifacts under crates/
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Check for committed zig caches / binaries
        run: bash scripts/check-no-build-artifacts.sh
