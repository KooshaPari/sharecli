name: CI

# Pin all third-party actions to commit SHAs to prevent supply-chain drift.
# Update via `just update-actions` (manual) or dependabot group `github-actions`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: short

jobs:
  # Formatting is OS-independent — keep Ubuntu-only to save runner minutes.
  fmt:
    name: cargo fmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust (stable + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Check formatting
        run: cargo fmt --all -- --check

  # Linux + macOS + Windows. Zig is required on Unix only; Windows uses the
  # spawn-core-sys Rust stub (see crates/spawn-core-sys/build.rs).
  clippy:
    name: cargo clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    # macOS advisory if Zig Darwin tooling regresses; Windows is required for
    # C07 L69 score-2 (cross-platform CI).
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Setup Zig
        if: runner.os != 'Windows'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.1
      - name: Export macOS SDK for Zig libc
        if: runner.os == 'macOS'
        run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Run clippy (deny warnings)
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    name: cargo nextest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Zig
        if: runner.os != 'Windows'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.1
      - name: Export macOS SDK for Zig libc
        if: runner.os == 'macOS'
        run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install nextest
        if: runner.os != 'Windows'
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2.84.0
        with:
          tool: nextest
      # taiki-e/install-action can fail on Windows GHA bash startup
      # (actions/partner-runner-images#169); get.nexte.st PS installer breaks
      # under pwsh 7. Compile cargo-nextest from crates.io (slow but reliable).
      - name: Install nextest (Windows)
        if: runner.os == 'Windows'
        run: cargo install cargo-nextest --locked
      - name: Run tests (nextest ci profile)
        # Uses .config/nextest.toml [profile.ci] — retries + fail-fast=false.
        # See docs/testing/flake-policy.md. Doctests are not run by nextest.
        run: cargo nextest run --locked --all-features --profile ci
      - name: Run doctests
        run: cargo test --doc --locked --all-features

  build:
    name: cargo build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Zig
        if: runner.os != 'Windows'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.1
      - name: Export macOS SDK for Zig libc
        if: runner.os == 'macOS'
        run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Build (debug)
        run: cargo build --locked --all-features
      - name: Build (release)
        run: cargo build --release --locked --all-features

  # C07 L65 — cargo-mutants hard gate (T-640 / FR-003). Parity with mutants.yml.
  mutants:
    name: cargo-mutants (required)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: mutants
      - name: Install cargo-mutants
        run: cargo install --locked cargo-mutants
      - name: Run cargo mutants (examine set; fail-on-survivors)
        run: |
          set -euo pipefail
          cargo mutants --timeout 60 --jobs 2 \
            -p sharecli-thermal-tui \
            --json-outfile mutants-hard.json \
            -- --locked
      - name: Upload mutants JSON
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-ci-${{ github.sha }}
          path: mutants-hard.json
          if-no-files-found: ignore
          retention-days: 14

  # C04 L38 — OSV/GHSA hard gate (T-650 / FR-003). Parity with osv.yml weekly SARIF.
  osv:
    name: OSV / GHSA lockfile scan (required)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan Cargo.lock with OSV-Scanner
        id: scan
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --lockfile=Cargo.lock
            --format=sarif
            --output=osv-results.sarif
            --severity=HIGH,CRITICAL
      - name: Upload SARIF
        if: always() && hashFiles('osv-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v3.27.0
        with:
          sarif_file: osv-results.sarif
        continue-on-error: true

  # C05 L50 — chaos restart hard gate (T-630 / FR-003). Parity with chaos-restart-hard.yml.
  chaos-restart-hard:
    name: chaos restart (required)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: chaos-restart-hard
      - name: Build sharecli (release)
        run: cargo build --locked --release -p sharecli
      - name: Chaos restart /healthz recovery
        env:
          SHARECLI_LOAD_URL: http://127.0.0.1:9000/healthz
          SHARECLI_SERVE_BIND: 127.0.0.1:9000
          SHARECLI_SERVE_BIN: ./target/release/sharecli
          SHARECLI_CHAOS_RECOVER_SEC: "30"
        run: bash scripts/load/chaos_restart.sh

  # C06 L54 — network-block hermetic hard gate (FR-003). Parity with netblock-soft.yml.
  netblock:
    name: netblock hermetic (required)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: netblock-hard
      - name: Netblock hermetic check (required)
        run: bash scripts/ci/netblock_check.sh

  # C00 L7 — loom hard gate (T-670 / FR-003). Models ProcessPool pid map + metrics atomics.
  loom:
    name: loom pool index (required)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: loom
      - name: Loom model tests
        run: RUSTFLAGS="--cfg loom" cargo test --release --locked -p sharecli-sync --test loom_pool_index

  ci-success:
    name: CI Success
    needs: [fmt, clippy, test, build, mutants, osv, chaos-restart-hard, netblock, loom]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify all required jobs passed
        if: needs.fmt.result == 'success' && needs.clippy.result == 'success' && needs.test.result == 'success' && needs.build.result == 'success' && needs.mutants.result == 'success' && needs.osv.result == 'success' && needs.chaos-restart-hard.result == 'success' && needs.netblock.result == 'success' && needs.loom.result == 'success'
        run: |
          echo "CI pipeline complete"
          echo "fmt:               ${{ needs.fmt.result }}"
          echo "clippy:            ${{ needs.clippy.result }}"
          echo "test:              ${{ needs.test.result }}"
          echo "build:             ${{ needs.build.result }}"
          echo "mutants:           ${{ needs.mutants.result }}"
          echo "osv:               ${{ needs.osv.result }}"
          echo "chaos-restart-hard: ${{ needs.chaos-restart-hard.result }}"
          echo "netblock:          ${{ needs.netblock.result }}"
          echo "loom:              ${{ needs.loom.result }}"
      - name: Fail if any required job did not succeed
        if: needs.fmt.result != 'success' || needs.clippy.result != 'success' || needs.test.result != 'success' || needs.build.result != 'success' || needs.mutants.result != 'success' || needs.osv.result != 'success' || needs.chaos-restart-hard.result != 'success' || needs.netblock.result != 'success' || needs.loom.result != 'success'
        run: |
          echo "fmt=${{ needs.fmt.result }} clippy=${{ needs.clippy.result }} test=${{ needs.test.result }} build=${{ needs.build.result }} mutants=${{ needs.mutants.result }} osv=${{ needs.osv.result }} chaos-restart-hard=${{ needs.chaos-restart-hard.result }} netblock=${{ needs.netblock.result }} loom=${{ needs.loom.result }}"
          exit 1
