name: CI

# Pin all third-party actions to commit SHAs to prevent supply-chain drift.
# Update via `just update-actions` (manual) or dependabot group `github-actions`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: short

jobs:
  # Formatting is OS-independent — keep Ubuntu-only to save runner minutes.
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Rust (stable + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check

  # Linux + macOS + Windows. Zig is required on Unix only; Windows uses the
  # spawn-core-sys Rust stub (see crates/spawn-core-sys/build.rs).
  clippy:
    name: cargo clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # macOS advisory if Zig Darwin tooling regresses; Windows is required for
    # C07 L69 score-2 (cross-platform CI).
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Rust (stable + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Setup Zig
        if: runner.os != 'Windows'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.1
      - name: Export macOS SDK for Zig libc
        if: runner.os == 'macOS'
        run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Run clippy (deny warnings)
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    name: cargo nextest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Zig
        if: runner.os != 'Windows'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.1
      - name: Export macOS SDK for Zig libc
        if: runner.os == 'macOS'
        run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install nextest
        if: runner.os != 'Windows'
        uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb # v2.83.0
        with:
          tool: nextest
      # taiki-e/install-action can fail on Windows GHA bash startup
      # (actions/partner-runner-images#169); get.nexte.st PS installer breaks
      # under pwsh 7. Compile cargo-nextest from crates.io (slow but reliable).
      - name: Install nextest (Windows)
        if: runner.os == 'Windows'
        run: cargo install cargo-nextest --locked
      - name: Run tests (nextest ci profile)
        # Uses .config/nextest.toml [profile.ci] — retries + fail-fast=false.
        # See docs/testing/flake-policy.md. Doctests are not run by nextest.
        run: cargo nextest run --locked --all-features --profile ci
      - name: Run doctests
        run: cargo test --doc --locked --all-features

  build:
    name: cargo build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Zig
        if: runner.os != 'Windows'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.1
      - name: Export macOS SDK for Zig libc
        if: runner.os == 'macOS'
        run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build (debug)
        run: cargo build --locked --all-features
      - name: Build (release)
        run: cargo build --release --locked --all-features

  ci-success:
    name: CI Success
    needs: [fmt, clippy, test, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs passed
        if: needs.fmt.result == 'success' && needs.clippy.result == 'success' && needs.test.result == 'success' && needs.build.result == 'success'
        run: |
          echo "CI pipeline complete"
          echo "fmt:     ${{ needs.fmt.result }}"
          echo "clippy:  ${{ needs.clippy.result }}"
          echo "test:    ${{ needs.test.result }}"
          echo "build:   ${{ needs.build.result }}"
      - name: Fail if any required job did not succeed
        if: needs.fmt.result != 'success' || needs.clippy.result != 'success' || needs.test.result != 'success' || needs.build.result != 'success'
        run: |
          echo "fmt=${{ needs.fmt.result }} clippy=${{ needs.clippy.result }} test=${{ needs.test.result }} build=${{ needs.build.result }}"
          exit 1
