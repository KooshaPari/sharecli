# ============================================================================
# Release Pipeline — linux + mac artifact matrix + crates.io publish
# ============================================================================
# Builds release archives for the cargo-dist targets declared in Cargo.toml:
#   Linux  · x86_64-unknown-linux-gnu  → sharecli-*-unknown-linux-gnu.tar.gz
#   macOS  · aarch64-apple-darwin      → sharecli-*-apple-darwin.tar.gz
#
# Triggered by workflow_dispatch, `chore(release): ...` on main, or `v*` tags.
# Tag/dispatch path attaches UNSIGNED tarballs + sha256 (+ SBOM) to a GitHub Release.
# Codesign/notarization (L112) remains deferred — assets are checksummed, not signed.
# ============================================================================

name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not publish crates.io / skip GH Release attach)'
        required: false
        default: 'true'
        type: boolean
      attach_github_release:
        description: 'Attach unsigned archives to a GitHub Release (tag or v{Cargo.toml version})'
        required: false
        default: 'true'
        type: boolean

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.1

      - name: Export macOS SDK for Zig libc
        if: runner.os == 'macOS'
        run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Determine version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing version: ${VERSION}"

      - name: Build release binary
        shell: bash
        env:
          # Reproducibility seed for release binaries (C06 L52).
          SOURCE_DATE_EPOCH: "0"
        run: |
          set -euo pipefail
          cargo build --release --locked --bin sharecli --target ${{ matrix.target }}

      - name: Install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx

      - name: Package archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TARGET="${{ matrix.target }}"
          STAGE="sharecli-${VERSION}-${TARGET}"
          mkdir -p "${STAGE}"
          BIN="target/${TARGET}/release/sharecli"
          if [[ ! -f "${BIN}" ]]; then
            BIN="target/${TARGET}/release/sharecli.exe"
          fi
          cp "${BIN}" "${STAGE}/sharecli"
          cargo cyclonedx --format json --spec-version 1.5 --override-filename sharecli
          # cargo-cyclonedx ≥0.5 writes `sharecli.json` (not `sharecli.cdx.json`).
          if [[ -f sharecli.json ]]; then
            mv -f sharecli.json sharecli.cdx.json
          fi
          test -f sharecli.cdx.json
          cp sharecli.cdx.json "${STAGE}/sharecli.cdx.json"
          ARCHIVE="sharecli-${TARGET}.tar.gz"
          tar -czf "${ARCHIVE}" -C "${STAGE}" .
          shasum -a 256 "${ARCHIVE}" | tee "${ARCHIVE}.sha256"
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"

      - name: Upload platform artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sharecli-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          retention-days: 90
          if-no-files-found: error

      - name: Test release build (host)
        if: matrix.os == 'ubuntu-latest'
        run: cargo test --release --locked --all-features

  attest:
    name: SLSA Build Attestation (L2)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: sharecli-*
          merge-multiple: false

      - name: Flatten artifact tree
        run: |
          set -euo pipefail
          find release-artifacts -type f \( -name '*.tar.gz' -o -name '*.sha256' \) -print
          ls -laR release-artifacts/

      - name: Upload combined artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts
          path: release-artifacts/
          retention-days: 90
          if-no-files-found: warn

      - name: Attest build provenance
        uses: slsa-framework/slsa-github-generator/attest-build-provenance@ed8a9d96c023b81521c9c9fb6c2a6e3edff257d7 # v1.9.0
        with:
          artifact-name: release-artifacts

  publish:
    name: Publish to crates.io
    needs: build
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'chore(release)')
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Publish (uses CARGO_REGISTRY_TOKEN from environment)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo ">> DRY RUN — running cargo publish --dry-run"
            cargo publish --dry-run --locked
          else
            echo ">> LIVE PUBLISH"
            cargo publish --locked
          fi

  # Unsigned GitHub Release attach (L118). Uses GITHUB_TOKEN only — no Apple secrets.
  github-release:
    name: Attach unsigned assets to GitHub Release
    needs: [build, attest]
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.attach_github_release == 'true' && github.event.inputs.dry_run != 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: sharecli-*
          merge-multiple: true

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Attaching UNSIGNED assets to ${TAG}"

      - name: Create or update GitHub Release (UNSIGNED)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          NOTES=$'## UNSIGNED release assets\n\nThese archives include `.sha256` digests and optional CycloneDX SBOM.\n**Not** Apple-notarized / codesigned (C11 L112 still open).\nAfter attach, fill Homebrew `sha256` from the darwin tarball digest.\n'
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release-artifacts/*.tar.gz release-artifacts/*.sha256 --clobber
          else
            gh release create "${TAG}" release-artifacts/*.tar.gz release-artifacts/*.sha256 \
              --title "${TAG}" \
              --notes "${NOTES}" \
              --latest=false
          fi
