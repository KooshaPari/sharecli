# ============================================================================
# Release Pipeline — linux + mac artifact matrix + crates.io publish
# ============================================================================
# Builds release archives for the cargo-dist targets declared in Cargo.toml:
#   Linux  · x86_64-unknown-linux-gnu  → sharecli-*-unknown-linux-gnu.tar.gz
#   macOS  · aarch64-apple-darwin      → sharecli-*-apple-darwin.tar.gz
#
# Triggered by workflow_dispatch, `chore(release): ...` on main, or `v*` tags.
# Tag/dispatch path attaches UNSIGNED tarballs + sha256 (+ SBOM) to a GitHub Release.
# Codesign/notarization (L112) remains deferred — assets are checksummed, not signed.
# ============================================================================

name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not publish crates.io / skip GH Release attach)'
        required: false
        default: 'true'
        type: boolean
      attach_github_release:
        description: 'Attach unsigned archives to a GitHub Release (tag or v{Cargo.toml version})'
        required: false
        default: 'true'
        type: boolean

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Zig
        if: runner.os != 'Windows'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.1

      - name: Export macOS SDK for Zig libc
        if: runner.os == 'macOS'
        run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: release-${{ matrix.target }}

      - name: Determine version
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing version: ${VERSION}"

      - name: Build release binary
        shell: bash
        env:
          # Reproducibility seed for release binaries (C06 L52).
          SOURCE_DATE_EPOCH: "0"
        run: |
          set -euo pipefail
          cargo build --release --locked --bin sharecli --target ${{ matrix.target }}

      - name: Install cargo-cyclonedx
        if: runner.os != 'Windows'
        run: cargo install --locked cargo-cyclonedx

      - name: Package archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TARGET="${{ matrix.target }}"
          ARCHIVE_KIND="${{ matrix.archive }}"
          STAGE="sharecli-${VERSION}-${TARGET}"
          mkdir -p "${STAGE}"
          BIN="target/${TARGET}/release/sharecli"
          if [[ ! -f "${BIN}" ]]; then
            BIN="target/${TARGET}/release/sharecli.exe"
          fi
          if [[ "${BIN}" == *.exe ]]; then
            cp "${BIN}" "${STAGE}/sharecli.exe"
          else
            cp "${BIN}" "${STAGE}/sharecli"
          fi
          if command -v cargo-cyclonedx >/dev/null 2>&1; then
            cargo cyclonedx --format json --spec-version 1.5 --override-filename sharecli
            if [[ -f sharecli.json ]]; then
              mv -f sharecli.json sharecli.cdx.json
            fi
            if [[ -f sharecli.cdx.json ]]; then
              cp sharecli.cdx.json "${STAGE}/sharecli.cdx.json"
            fi
          fi
          if [[ "${ARCHIVE_KIND}" == "zip" ]]; then
            ARCHIVE="sharecli-${TARGET}.zip"
            (cd "${STAGE}" && zip -r "../${ARCHIVE}" .)
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${ARCHIVE}" | tee "${ARCHIVE}.sha256"
            else
              shasum -a 256 "${ARCHIVE}" | tee "${ARCHIVE}.sha256"
            fi
          else
            ARCHIVE="sharecli-${TARGET}.tar.gz"
            tar -czf "${ARCHIVE}" -C "${STAGE}" .
            shasum -a 256 "${ARCHIVE}" | tee "${ARCHIVE}.sha256"
          fi
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"

      - name: Upload platform artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sharecli-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256
          retention-days: 90
          if-no-files-found: error

      - name: Test release build (host)
        if: matrix.os == 'ubuntu-24.04'
        run: cargo test --release --locked --all-features

  tray-linux:
    name: Tray Linux (beta)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: release-tray-linux
      - name: Build + pack
        run: |
          set -euo pipefail
          cargo build -p sharecli-tray-linux --release --locked
          STAGE=sharecli-tray-linux
          mkdir -p "$STAGE"
          cp target/release/sharecli-tray "$STAGE/sharecli-tray"
          ARCHIVE=sharecli-tray-linux-x86_64.tar.gz
          tar -czf "$ARCHIVE" -C "$STAGE" .
          shasum -a 256 "$ARCHIVE" | tee "${ARCHIVE}.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sharecli-tray-linux-x86_64
          path: |
            sharecli-tray-linux-x86_64.tar.gz
            sharecli-tray-linux-x86_64.tar.gz.sha256

  attest:
    name: SLSA Build Attestation (L2)
    needs: [build, tray-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download all platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts
          pattern: sharecli-*
          merge-multiple: false

      - name: Flatten artifact tree
        run: |
          set -euo pipefail
          find release-artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) -print
          ls -laR release-artifacts/

      - name: Upload combined artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts
          path: release-artifacts/
          retention-days: 90
          if-no-files-found: warn

      - name: Attest build provenance
        continue-on-error: true
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "release-artifacts/**/*.{tar.gz,zip}"

  publish:
    name: Publish to crates.io
    needs: build
    # Only live-publish on explicit non-dry workflow_dispatch or chore(release) commits.
    # Default dispatch uses dry_run=true; attach path must not depend on crates.io.
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true') ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, 'chore(release)'))
    runs-on: ubuntu-24.04
    environment: release
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Publish (uses CARGO_REGISTRY_TOKEN from environment)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo ">> DRY RUN — running cargo publish --dry-run"
            cargo publish --dry-run --locked
          else
            echo ">> LIVE PUBLISH"
            cargo publish --locked
          fi

  # Unsigned GitHub Release attach (L118). Uses GITHUB_TOKEN only — no Apple secrets.
  # Depends on build + tray-linux — attest is best-effort and must not block bottle attach.
  github-release:
    name: Attach unsigned assets to GitHub Release
    needs: [build, tray-linux]
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.attach_github_release == 'true' && github.event.inputs.dry_run != 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts
          pattern: sharecli-*
          merge-multiple: true

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          shopt -s nullglob
          ASSETS=(release-artifacts/*.tar.gz release-artifacts/*.zip release-artifacts/*.sha256)
          if [[ ${#ASSETS[@]} -eq 0 ]]; then
            echo "No release assets found under release-artifacts/"
            ls -laR release-artifacts || true
            exit 1
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ASSETS[@]}" --clobber
          else
            gh release create "${TAG}" "${ASSETS[@]}" \
              --title "${TAG}" \
              --notes "Unsigned CLI + tray archives (see docs/deploy/FINALITY.md). Not notarized."
          fi
