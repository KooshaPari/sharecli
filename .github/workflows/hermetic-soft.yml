name: Hermetic build (soft)

# C06 L54 — fetch then --offline build. Soft until network-blocked runners land.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hermetic-soft:
    name: Offline build after fetch (soft)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: hermetic-soft
      - name: Fetch locked deps
        run: cargo fetch --locked
      - name: Offline build (sharecli)
        run: cargo build --locked --offline -p sharecli
      - name: Soft runbook present
        run: test -f docs/ops/hermetic-builds.md
