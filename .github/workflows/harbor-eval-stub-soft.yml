name: Harbor eval stub (soft)

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'docs/eval/corpus/**'
      - 'scripts/eval/**'
      - 'docs/ops/harbor-eval-stub.md'
      - '.github/workflows/harbor-eval-stub-soft.yml'

permissions:
  contents: read

jobs:
  harbor-stub:
    name: Harbor eval stub (corpus preflight)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run Harbor eval stub
        run: bash scripts/eval/harbor_stub.sh
