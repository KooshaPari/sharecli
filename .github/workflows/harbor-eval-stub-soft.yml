name: Harbor eval stub (soft)

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'docs/eval/corpus/**'
      - 'scripts/eval/**'
      - 'audit/.lane-c08/harbor-phase3-soak-log.md'
      - 'docs/ops/harbor-eval-stub.md'
      - 'docs/ops/harbor-phase3-soak.md'
      - '.github/workflows/harbor-eval-stub-soft.yml'
      - '.github/workflows/harbor-soak-exec-soft.yml'

permissions:
  contents: read

jobs:
  harbor-stub:
    name: Harbor eval stub (corpus preflight)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run Harbor eval stub
        run: bash scripts/eval/harbor_stub.sh
