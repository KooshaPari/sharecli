name: Network block (soft)

# C06 L54 — soft CARGO_NET_OFFLINE check after locked fetch (continue-on-error).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  netblock-soft:
    name: Offline check after fetch (soft)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.0.6
        with:
          version: 0.14.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: netblock-soft
      - name: Netblock soft gate
        run: bash scripts/ci/netblock_check.sh
      - name: Soft runbook present
        run: test -f docs/ops/network-block-build.md
