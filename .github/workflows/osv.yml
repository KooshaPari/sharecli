name: OSV Scanner

# C04 L38 — OSV/GHSA feed beyond RustSec cargo-audit (hard HIGH/CRITICAL gate).
# PR coverage lives in ci.yml `osv` (ci-success aggregator). This workflow
# retains weekly SARIF + workflow_dispatch parity.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  osv:
    name: OSV / GHSA lockfile scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan Cargo.lock with OSV-Scanner
        # Severity gate intent: --severity=HIGH,CRITICAL (documented; osv-scanner
        # v2.3.8 has no CLI severity flag — findings gate via code-scanning alerts).
        id: scan
        uses: google/osv-scanner-action/osv-scanner-action@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
        with:
          scan-args: |-
            --lockfile=Cargo.lock
            --config=osv-scanner.toml
            --format=sarif
            --output=osv-results.sarif
      - name: Upload SARIF
        if: always() && hashFiles('osv-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v3.27.0
        with:
          sarif_file: osv-results.sarif
        continue-on-error: true
