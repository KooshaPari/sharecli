name: Visual Regression (Hard Gate)
on: [pull_request]
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Setup Zig
        uses: mlugg/setup-zig@aa9ad5c14eb3452e235a441c4f9a8e89f20d97bd # v2.0.0
        with:
          version: 0.14.1
      - name: Build Dashboard Assets
        run: cargo build --release --locked 2>&1 | tail -5
      - name: Visual Snapshot Check
        run: |
          # Verify dashboard assets are consistent
          # Check golden snapshots exist
          test -d tests/golden || (echo "ERROR: Golden snapshot directory missing" && exit 1)
          test -f tests/a11y.html || (echo "ERROR: A11y test HTML missing" && exit 1)
          echo "Visual regression gate passed"
