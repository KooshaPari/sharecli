name: Visual Regression (Hard Gate)
on: [pull_request]
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.14.1
      - name: Build Dashboard Assets
        run: cargo build --release --locked 2>&1 | tail -5
      - name: Visual Snapshot Check
        run: |
          # Verify dashboard assets are consistent
          # Check golden snapshots exist
          test -d tests/golden || (echo "ERROR: Golden snapshot directory missing" && exit 1)
          test -f tests/a11y.html || (echo "ERROR: A11y test HTML missing" && exit 1)
          echo "Visual regression gate passed"
