name: Release Attestation

# ============================================================================
# C06 SLSA Build Level 3 — ephemeral containerized generator
# ============================================================================
# Promoted from SLSA Build L2 (attest-build-provenance@v1 action) to
# SLSA Build L3 (generator_containerized_slsa3.yml@v2 reusable workflow).
#
# L3 hardening:
#   - Build runs in ephemeral container with digest-pinned base image
#   - Provenance signed via ephemeral Sigstore Fulcio key (no long-lived key)
#   - Provenance logged to ephemeral Rekor (TUF-pinned transparency log)
#   - OIDC identity from GitHub Actions (subject: repo:owner/repo:ref:refs/tags/<tag>)
#
# Inputs / Outputs mirror the L2 generator for drop-in compatibility.
# See docs/ops/slsa-l3-plan.md for full migration rationale + hermetic notes.
# ============================================================================

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-and-attest:
    name: Build and Attest (SLSA Build L3)
    # Pinned to v2.0.0 commit SHA per SLSA L3 hardening requirement
    # (digest-pinned generator). Tag `@v2` is mutable; this SHA is immutable.
    # Resolves via: curl -sL https://api.github.com/repos/slsa-framework/slsa-github-generator/git/refs/tags/v2.0.0 | jq -r .object.sha
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_containerized_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      source-repo: ${{ github.repository_owner }}/${{ github.event.repository.name }}
      build-command: |
        set -euo pipefail
        cargo build --release --locked --workspace --all-targets
        mkdir -p release-artifacts
        find target/release -maxdepth 1 -type f -executable \
          -exec cp -t release-artifacts/ {} + 2>/dev/null || true
        tar \
          --exclude='./target' \
          --exclude='./.git' \
          --exclude='./release-artifacts' \
          -czf release-artifacts/source.tar.gz \
          -C "$RUNNER_TEMP/workdir" .
        cat > release-artifacts/BUILD_MANIFEST.txt <<EOF
        # Release Build Manifest (SLSA Build L3)
        repository: ${{ github.repository }}
        ref:        ${{ github.ref }}
        sha:        ${{ github.sha }}
        runner:     ephemeral-container
        rustc:      $(rustc --version)
        cargo:      $(cargo --version)
        built_at:   $(date -u +%Y-%m-%dT%H:%M:%SZ)
        slsa_level: 3
        generator:   slsa-framework/slsa-github-generator/.github/workflows/generator_containerized_slsa3.yml@v2
        EOF
        echo "=== Release artifacts ==="
        ls -la release-artifacts/
      artifact-path: release-artifacts
    permissions:
      contents: read
      id-token: write
      attestations: write
