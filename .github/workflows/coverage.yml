name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  COVERAGE_THRESHOLD: 85

jobs:
  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Test coverage snapshot parser
        run: python -m unittest scripts/test_coverage_snapshot.py

      - name: Setup Rust (stable + llvm-tools)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.1

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@c7eb1735f09259a5035e8e5d44b1406b1cddc0fb # cargo-llvm-cov

      - name: Guard — refuse empty test suite
        run: |
          set -euo pipefail
          OUT=$(cargo test --locked --all-features -- --list 2>/dev/null || true)
          COUNT=$(printf '%s\n' "$OUT" | grep -c ': test$' || true)
          echo "Discovered tests: $COUNT"
          if [ "${COUNT:-0}" -le 0 ]; then
            echo "No tests discovered (cargo test -- --list). Failing coverage job."
            exit 1
          fi

      - name: Run coverage (llvm-cov)
        run: |
          cargo llvm-cov --locked --all-features --workspace \
            --json --output-path coverage-llvm-cov.json
          cargo llvm-cov report --lcov --output-path lcov.info

      - name: Create coverage snapshot
        run: |
          python scripts/coverage_snapshot.py \
            coverage-llvm-cov.json coverage-snapshot.json \
            --git-sha "${GITHUB_SHA}" \
            --run-id "${GITHUB_RUN_ID}" \
            --threshold "${COVERAGE_THRESHOLD}"
          cat coverage-snapshot.json

      - name: Upload coverage snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-snapshot-${{ github.sha }}
          path: coverage-snapshot.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          fail_ci_if_error: false
