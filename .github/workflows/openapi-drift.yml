name: OpenAPI Drift

on:
  pull_request:
    paths:
      - "src/commands/serve.rs"
      - "docs/openapi/**"
      - "scripts/check-openapi-drift.py"
      - ".github/workflows/openapi-drift.yml"
  push:
    branches: [main]
    paths:
      - "src/commands/serve.rs"
      - "docs/openapi/**"
      - "scripts/check-openapi-drift.py"

permissions:
  contents: read

jobs:
  openapi-drift:
    name: OpenAPI ↔ serve routes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Check OpenAPI drift (C00 L2)
        run: python3 scripts/check-openapi-drift.py
