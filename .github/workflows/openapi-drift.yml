name: OpenAPI Drift

on:
  pull_request:
    paths:
      - "src/commands/serve.rs"
      - "docs/openapi/**"
      - "scripts/check-openapi-drift.py"
      - ".github/workflows/openapi-drift.yml"
  push:
    branches: [main]
    paths:
      - "src/commands/serve.rs"
      - "docs/openapi/**"
      - "scripts/check-openapi-drift.py"

permissions:
  contents: read

jobs:
  openapi-drift:
    name: OpenAPI ↔ serve routes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check OpenAPI drift (C00 L2)
        run: python3 scripts/check-openapi-drift.py
