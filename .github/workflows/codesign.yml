# =============================================================================
# C11 L112 — Codesign hard gate (promotes from soft gate)
# =============================================================================
# All sign + notarize + staple steps must pass for main builds.
# Windows signing is continue-on-error until Azure Key Vault is configured.
# =============================================================================

name: Code Signing (Hard Gate)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codesign-hard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-sign:
    name: macOS codesign + notarize (hard gate — Infisical-backed Apple secrets)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch Apple secrets from Infisical
        id: infisical
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID || secrets.INFISICAL_PROJECT_ID || '8efe392e-56a6-4c3c-89f9-8141183dd7e8' }}
          INFISICAL_ENV: ${{ vars.INFISICAL_ENV || 'prod' }}
        run: |
          set -euo pipefail
          if [[ -z "$INFISICAL_TOKEN" ]]; then
            echo "::error::INFISICAL_TOKEN secret not configured in repo settings"
            exit 1
          fi
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install infisical/get-cli/infisical
          else
            # S6506: enforce HTTPS-only (no protocol downgrade across redirects).
            # Fetch the setup script to a file, then execute — avoids the
            # curl | sudo bash antipattern and keeps errors visible.
            curl -1sSfL --proto '=https' --tlsv1.2 \
              "https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.deb.sh" \
              -o "$RUNNER_TEMP/infisical-setup.deb.sh"
            sudo -E bash "$RUNNER_TEMP/infisical-setup.deb.sh"
            sudo apt-get install -y infisical
          fi
          # Per-secret read: avoids ALL dotenv quoting/escaping issues that
          # affect the macOS Infisical CLI v0.43.129 (which adds escape
          # backslashes for special chars like '=' and '+' inside long b64
          # values, breaking any bash parameter-expansion or tr-based extract).
          # Each `infisical secrets get --plain` writes the raw b64 to a file
          # with no quoting at all (just the value followed by a newline).
          infisical secrets get APPLE_CERTIFICATE \
            --projectId "$INFISICAL_PROJECT_ID" \
            --env "$INFISICAL_ENV" \
            --token "$INFISICAL_TOKEN" \
            --plain > "$RUNNER_TEMP/APPLE_CERTIFICATE.b64"
          for key in APPLE_CERTIFICATE_PWD APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            # --plain returns the raw value (no Infisical table header like
            # 'SECRET NAME | SECRET VALUE | SECRET TYPE'), so writing to
            # $GITHUB_ENV never triggers 'Unable to process file command'.
            val=$(infisical secrets get "$key" \
              --projectId "$INFISICAL_PROJECT_ID" \
              --env "$INFISICAL_ENV" \
              --token "$INFISICAL_TOKEN" \
              --plain)
            if [[ -z "$val" ]]; then
              echo "::error::${key} not found in Infisical env '${INFISICAL_ENV}'"
              exit 1
            fi
            echo "${key}=${val}" >> "$GITHUB_ENV"
          done

      # Decode the native p12 (PBES2) from the raw base64 file. The b64 is read
      # DIRECTLY from a file written by the Infisical CLI's per-secret read
      # (not via the $APPLE_CERTIFICATE env var) because GitHub Actions
      # truncates env vars at ~18KB and the b64 is ~41KB. No openssl re-wrap:
      # macOS `security import` accepts the native p12 produced by
      # `security export` (verified RAW_IMPORT_OK=1), and the earlier
      # 'passphrase incorrect' error was the env-var truncation, not the
      # p12 format.
      - name: Decode Apple certificate (native p12 from b64)
        run: |
          set -euo pipefail
          CERT_B64=$(cat "$RUNNER_TEMP/APPLE_CERTIFICATE.b64" | tr -d '[:space:]')
          if (( ${#CERT_B64} % 4 != 0 )); then
            echo "::error::APPLE_CERTIFICATE b64 length ${#CERT_B64} is NOT a multiple of 4 (raw b64 from Infisical corrupted?)"
            exit 1
          fi
          printf '%s' "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/DeveloperID_Application.p12"
          echo "native p12 size: $(wc -c < "$RUNNER_TEMP/DeveloperID_Application.p12") bytes"
          # Emit the file path as a workflow env var so the next step can
          # reference it via $P12_PATH (paths don't suffer truncation).
          echo "P12_PATH=$RUNNER_TEMP/DeveloperID_Application.p12" >> "$GITHUB_ENV"

      - name: Import Apple certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-filepath: ${{ env.P12_PATH }}
          p12-password: ${{ env.APPLE_CERTIFICATE_PWD }}

      - name: Install zig (spawn-core-sys build dependency)
        run: |
          set -euo pipefail
          ZIG_VER=0.14.1
          if [[ "$(uname -m)" == "arm64" ]]; then
            TARGET=zig-aarch64-macos
          else
            TARGET=zig-x86_64-macos
          fi
          curl -sSfL "https://ziglang.org/download/${ZIG_VER}/${TARGET}-${ZIG_VER}.tar.xz" \
            -o "$RUNNER_TEMP/zig.tar.xz"
          tar -xf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/${TARGET}-${ZIG_VER}" >> "$GITHUB_PATH"
          zig version

      - name: Build release binary
        run: cargo build --release --locked 2>&1 | tail -5

      - name: Codesign release binary
        run: codesign --force --sign "-" target/release/sharecli

      - name: Notarize release binary
        env:
          APPLE_ID: ${{ env.APPLE_ID }}
          APPLE_TEAM_ID: ${{ env.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ env.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent target/release/sharecli sharecli.zip
          xcrun notarytool submit sharecli.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait

      - name: Staple notarization ticket
        run: xcrun stapler staple target/release/sharecli

      - name: Verify codesign
        run: codesign --verify --deep --strict target/release/sharecli

  windows-sign:
    name: Windows Authenticode sign (soft — continue-on-error)
    runs-on: windows-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build release binary
        run: cargo build --release --locked 2>&1 | tail -5

      - name: Sign Windows binary (Azure Key Vault)
        if: env.AZURE_KEY_VAULT_URL != ''
        env:
          AZURE_KEY_VAULT_URL: ${{ secrets.AZURE_KEY_VAULT_URL }}
          AZURE_KEY_VAULT_CLIENT_ID: ${{ secrets.AZURE_KEY_VAULT_CLIENT_ID }}
          AZURE_KEY_VAULT_CLIENT_SECRET: ${{ secrets.AZURE_KEY_VAULT_CLIENT_SECRET }}
          AZURE_KEY_VAULT_TENANT_ID: ${{ secrets.AZURE_KEY_VAULT_TENANT_ID }}
        run: |
          dotnet tool install -g AzureSignTool
          AzureSignTool sign \
            -kvu "$AZURE_KEY_VAULT_URL" \
            -kvi "$AZURE_KEY_VAULT_CLIENT_ID" \
            -kvs "$AZURE_KEY_VAULT_CLIENT_SECRET" \
            -kvt "$AZURE_KEY_VAULT_TENANT_ID" \
            -kvc "$AZURE_KEY_VAULT_CERTIFICATE" \
            target/release/sharecli.exe

      - name: Sign Windows binary (skip - no Azure KV)
        if: env.AZURE_KEY_VAULT_URL == ''
        env:
          AZURE_KEY_VAULT_URL: ${{ secrets.AZURE_KEY_VAULT_URL }}
        run: |
          echo "::notice::Windows Authenticode signing not configured (Azure Key Vault secrets missing). Binary will be unsigned."
