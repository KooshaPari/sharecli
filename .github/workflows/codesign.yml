# =============================================================================
# C11 L112 — Codesign hard gate (promotes from soft gate)
# =============================================================================
# All sign + notarize + staple steps must pass for main builds.
# Windows signing is continue-on-error until Azure Key Vault is configured.
# =============================================================================

name: Code Signing (Hard Gate)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codesign-hard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-sign:
    name: macOS codesign + notarize (hard gate)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Import Apple certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PWD }}

      - name: Build release binary
        run: cargo build --release

      - name: Codesign release binary
        run: codesign --force --sign "-" target/release/sharecli

      - name: Notarize release binary
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent target/release/sharecli sharecli.zip
          xcrun notarytool submit sharecli.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait

      - name: Staple notarization ticket
        run: xcrun stapler staple target/release/sharecli

      - name: Verify codesign
        run: codesign --verify --deep --strict target/release/sharecli

  windows-sign:
    name: Windows Authenticode sign (soft — continue-on-error)
    runs-on: windows-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build release binary
        run: cargo build --release

      - name: Sign Windows binary (placeholder)
