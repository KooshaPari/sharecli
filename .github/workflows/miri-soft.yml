name: Miri (soft)

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'crates/harness-native/**'
      - 'src/**'
      - '.github/workflows/miri-soft.yml'

permissions:
  contents: read

jobs:
  miri:
    name: cargo miri (soft)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Rust nightly + miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Miri (harness-native lib tests)
        run: |
          set -euo pipefail
          cd crates/harness-native
          cargo miri test --locked --lib 2>&1 | tee miri.log || true
          echo "soft miri finished (non-blocking)"
