name: Mutation Testing

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/sharecli-thermal-tui/**"
      - "mutants.toml"
      - "docs/ops/mutants-threshold.md"
      - ".github/workflows/mutants.yml"

permissions:
  contents: read

jobs:
  mutants-soft:
    name: cargo-mutants (soft threshold)
    runs-on: ubuntu-24.04
    # Soft until examine set stays green on main for one week (docs/ops/mutants-threshold.md).
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: mutants
      - name: Install cargo-mutants
        run: cargo install --locked cargo-mutants
      - name: Run cargo mutants (examine set; soft fail-on-survivors)
        run: |
          set -euo pipefail
          cargo mutants --timeout 60 --jobs 2 \
            --file 'crates/sharecli-thermal-tui/src/lib.rs' \
            --json-outfile mutants-soft.json \
            -- --locked -p sharecli-thermal-tui
          # cargo-mutants exits non-zero if survivors remain — that fails this step
          # while the job stays soft via continue-on-error.
      - name: Upload mutants JSON (soft artifact)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75a8047ad91e6fcd76e75f4be1f # v4.6.2
        with:
          name: mutants-soft-${{ github.sha }}
          path: mutants-soft.json
          if-no-files-found: ignore
          retention-days: 14
