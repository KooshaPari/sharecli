name: Mutation Testing

# C07 L65 — cargo-mutants hard gate (T-640 / FR-003).
# Promotion: docs/ops/mutants-hard-gate.md phase 4.
# Aggregated into CI Success via .github/workflows/ci.yml `mutants` job.

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
  # PR coverage lives in ci.yml `mutants` (ci-success aggregator). This workflow
  # keeps cron/dispatch + path-filtered main push for drift detection without
  # double-running mutants on every PR.
  push:
    branches: [main]
    paths:
      - "crates/sharecli-thermal-tui/**"
      - "mutants.toml"
      - ".cargo/mutants.toml"
      - "docs/ops/mutants-threshold.md"
      - "docs/ops/mutants-hard-gate.md"
      - ".github/workflows/mutants.yml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  mutants:
    name: cargo-mutants (required)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: mutants
      - name: Install cargo-mutants
        run: cargo install --locked cargo-mutants
      - name: Run cargo mutants (examine set; fail-on-survivors)
        run: |
          set -euo pipefail
          cargo mutants --timeout 60 --jobs 2 \
            -p sharecli-thermal-tui \
            --json-outfile mutants-hard.json \
            -- --locked
          # cargo-mutants exits non-zero if survivors remain — that fails this job.
      - name: Upload mutants JSON
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutants-hard-${{ github.sha }}
          path: mutants-hard.json
          if-no-files-found: ignore
          retention-days: 14
