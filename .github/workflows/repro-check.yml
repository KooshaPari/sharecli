name: Repro Check

# C06 L52 — bit-identical release binary with SOURCE_DATE_EPOCH (FR-002 determinism).
# Unix-only: Windows uses spawn-core-sys stub; release matrix covers cross-target.

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'src/**'
      - 'scripts/repro-check.sh'
      - '.github/workflows/repro-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'src/**'
      - 'scripts/repro-check.sh'
      - '.github/workflows/repro-check.yml'
  workflow_dispatch:

concurrency:
  group: repro-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SOURCE_DATE_EPOCH: "0"

jobs:
  repro-check:
    name: Reproducible build (L52)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Run repro-check
        run: bash scripts/repro-check.sh
