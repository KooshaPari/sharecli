name: Scorecard

# OSSF Security Scorecard: measures supply-chain security practices.
# Publishes results to the Security tab and uploads SARIF to code-scanning.

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * 3'  # Wednesdays 08:00 UTC
  workflow_dispatch:

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Top-level must stay read-only for publish_results; write scopes only on the job.
permissions: read-all

jobs:
  analysis:
    name: OSSF Scorecard
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: results.sarif
          path: results.sarif
          retention-days: 30
      - name: Upload to code-scanning
        if: always()
        uses: github/codeql-action/upload-sarif@4dd16135b69a43b6c8efb853346f8437d92d3c93 # v3.27.0
        with:
          sarif_file: results.sarif
