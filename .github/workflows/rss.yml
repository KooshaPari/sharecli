name: RSS hard gate

# C00 L8 — hard idle RSS gate for sharecli serve (blocks merge).
# Promotes the soft rss-soft.yml to a required check after jemalloc soak.

on:
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docs/ops/memory.md"
      - ".github/workflows/rss.yml"
      - "scripts/ops/rss_gate.sh"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docs/ops/memory.md"
      - ".github/workflows/rss.yml"
      - "scripts/ops/rss_gate.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rss-hard:
    name: idle RSS hard budget
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: rss-hard
      - name: Build sharecli (release, jemalloc)
        run: cargo build --locked --release -p sharecli --features jemalloc
      - name: Idle RSS hard gate
        run: bash scripts/ops/rss_gate.sh
