name: Packaging (soft)

# C11 L108 phase 3 — unsigned native installer scaffold (.deb) + metadata check.
# Signed dmg/msi remain blocked on L112 secrets.

on:
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'scripts/packaging/**'
      - '.github/workflows/packaging-soft.yml'
      - 'docs/ops/dmg-msi-packaging.md'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'scripts/packaging/**'
      - '.github/workflows/packaging-soft.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb-package:
    name: build unsigned .deb (linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: packaging-deb
      - name: Build sharecli (release)
        run: cargo build --locked --release -p sharecli
      - name: Build unsigned .deb
        run: bash scripts/packaging/build_deb.sh
      - name: Assert .deb artifact
        run: |
          set -euo pipefail
          deb="$(ls -1 dist/sharecli_*.deb | head -1)"
          test -s "$deb"
          dpkg-deb -c "$deb" | grep -q '/usr/bin/sharecli'
          dpkg-deb -c "$deb" | grep -q 'lib/systemd/system/sharecli.service'
      - name: Upload .deb artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sharecli-deb-${{ github.sha }}
          path: dist/sharecli_*.deb
          retention-days: 14

  dist-metadata:
    name: cargo-dist metadata present
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert [package.metadata.dist] targets
        run: |
          grep -q '^\[package.metadata.dist\]' Cargo.toml
          grep -q 'aarch64-apple-darwin' Cargo.toml
          grep -q 'x86_64-unknown-linux-gnu' Cargo.toml
          test -f docs/ops/dmg-msi-packaging.md
