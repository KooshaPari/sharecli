name: RSS sample (soft)

# C00 L8 — soft idle RSS sample for sharecli serve (continue-on-error).

on:
  pull_request:
    paths:
      - "src/**"
      - "docs/ops/memory.md"
      - "docs/ops/alloc-profiling.md"
      - ".github/workflows/rss-soft.yml"
      - "scripts/ops/rss_soft.sh"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "docs/ops/memory.md"
      - "docs/ops/alloc-profiling.md"
      - ".github/workflows/rss-soft.yml"
      - "scripts/ops/rss_soft.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rss-soft:
    name: idle RSS soft budget
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: rss-soft
      - name: Build sharecli (release)
        run: cargo build --locked --release -p sharecli
      - name: Sample idle RSS vs soft budget
        run: bash scripts/ops/rss_soft.sh
