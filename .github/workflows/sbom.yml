name: SBOM

# CycloneDX SBOM emission for supply-chain consumers (C04 / L32).
# Artifact: sharecli.cdx.json (uploaded as sharecli-sbom).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sbom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx

      - name: Generate CycloneDX SBOM
        run: |
          cargo cyclonedx --format json --spec-version 1.5 --override-filename sharecli
          # cargo-cyclonedx ≥0.5 writes `sharecli.json` (not `sharecli.cdx.json`).
          if [[ -f sharecli.json ]]; then
            mv -f sharecli.json sharecli.cdx.json
          fi
          test -f sharecli.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sharecli-sbom
          path: sharecli.cdx.json
          if-no-files-found: error
