name: SBOM

# CycloneDX SBOM emission for supply-chain consumers (C04 / L32).
# Artifact: sharecli.cdx.json (uploaded as sharecli-sbom).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sbom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-cyclonedx
        run: cargo install --locked cargo-cyclonedx

      - name: Generate CycloneDX SBOM
        run: |
          cargo cyclonedx --format json --spec-version 1.5 --override-filename sharecli
          # cargo-cyclonedx writes sharecli.cdx.json
          test -f sharecli.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sharecli-sbom
          path: sharecli.cdx.json
          if-no-files-found: error
