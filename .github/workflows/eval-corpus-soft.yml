name: Eval corpus (soft)

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'docs/eval/corpus/**'
      - 'scripts/eval/**'
      - '.github/workflows/eval-corpus-soft.yml'

permissions:
  contents: read

jobs:
  corpus:
    name: Validate eval corpus fixtures
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run corpus harness
        run: bash scripts/eval/run-corpus.sh
