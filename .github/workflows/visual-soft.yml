name: Visual baseline diff (soft)

# C10 L107 — soft pixel diff against committed dashboard PNG baselines.

on:
  pull_request:
    paths:
      - "src/dashboard.html"
      - "tests/visual/dashboard/**"
      - "scripts/visual/**"
      - "docs/visual/golden-visual-tests.md"
      - ".github/workflows/visual-soft.yml"
  push:
    branches: [main]
    paths:
      - "src/dashboard.html"
      - "tests/visual/dashboard/**"
      - "scripts/visual/**"
      - "docs/visual/golden-visual-tests.md"
      - ".github/workflows/visual-soft.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-soft:
    name: dashboard PNG soft diff
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.14.1
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: visual-soft
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Install Playwright + diff deps
        run: npm install --no-save playwright@1.49.0 pixelmatch@6.0.0 pngjs@7.0.0
      - name: Build sharecli
        run: cargo build --locked --release -p sharecli
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture viewports and soft diff
        run: |
          set -euo pipefail
          ./target/release/sharecli serve --bind 127.0.0.1:9000 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:9000/healthz && break; sleep 1; done
          node scripts/a11y/playwright_viewports.mjs
          node scripts/visual/compare_screenshots.mjs
