pull_request_rules:
  - name: auto-merge when approved and required checks green
    conditions:
      - "#approved-reviews-by>=1"
      - "check-success=ci / lint"
      - "check-success=ci / test"
      - "check-success=coverage"
      - "-conflict"
      - "-closed"
      - "-draft"
    actions:
      merge:
        method: squash
