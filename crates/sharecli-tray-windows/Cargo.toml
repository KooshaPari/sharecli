[package]
name = "sharecli-tray-windows"
version = "0.1.0"
edition = "2021"
description = "Windows WinUI tray wire types + mapping helpers for sharecli (FR-007 AC-007.51/AC-007.52)"
license = "MIT"
authors = ["Phenotype"]
repository = "https://github.com/KooshaPari/sharecli"

[lib]
name = "sharecli_tray_windows"
