[package]
name = "sharecli-fuse"
version = "0.1.0"
edition = "2021"
description = "FUSE IO-interception layer for the sharecli OS process/IO/syscall hypervisor"
license = "MIT"

[[bin]]
name = "fuse-mount-smoke"
path = "src/bin/fuse-mount-smoke.rs"
required-features = []

[dependencies]
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tempfile = "3"

# FUSE binding — cross-platform: Linux via libfuse3, macOS via macFUSE.
# Gated at compile time; see lib.rs #[cfg(any(target_os = "linux", target_os = "macos"))].
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
fuser = "0.17"
libc = "0.2"
# wraps: xattr 1.x — portable setxattr/getxattr for write provenance
xattr = "1.6"

[dev-dependencies]
tempfile = "3"
serial_test = "3"
