<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sharecli dashboard</title>
<style>
  :root {
    --bb2-graphite: #0a0d12;
    --bb2-panel: #161b22;
    --bb2-pulse-green: #3fb950;
    --bb2-warm-amber: #d29922;
    --bb2-muted: #94a3b8;
    --bb2-border: #2d333b;
    --motion-duration-fast: 150ms;
    --motion-duration: 300ms;
    --motion-ease: cubic-bezier(0.4, 0, 0.2, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bb2-graphite);
    color: #e2e8f0;
    font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
    font-size: 13px;
    padding: 24px;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }
  h1 { font-size: 18px; color: #e2e8f0; letter-spacing: 0.05em; }
  #status-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #ef4444;
    flex-shrink: 0;
    transition: background var(--motion-duration, 0.3s) var(--motion-ease, ease);
  }
  #status-dot.connected { background: #22c55e; }
  #status-label { font-size: 11px; color: var(--bb2-muted); }
  #operator-panels {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
  }
  .operator-panel {
    background: var(--bb2-panel);
    border: 1px solid var(--bb2-border);
    border-radius: 4px;
    padding: 10px 12px;
  }
  .operator-panel h2 {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--bb2-muted);
    margin-bottom: 8px;
    font-weight: 600;
  }
  .operator-panel dl {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 4px 10px;
    font-size: 12px;
  }
  .operator-panel dt { color: var(--bb2-muted); }
  .operator-panel dd { color: #e2e8f0; text-align: right; margin: 0; }
  .gate-admit { color: var(--bb2-pulse-green); }
  .gate-deny { color: #f85149; }
  .gate-unavailable { color: var(--bb2-warm-amber); }
  .families-list {
    margin-top: 6px;
    font-size: 11px;
    color: var(--bb2-muted);
    line-height: 1.4;
    word-break: break-word;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  thead th {
    background: var(--bb2-panel);
    color: var(--bb2-muted);
    text-align: left;
    padding: 8px 12px;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border-bottom: 1px solid #2d2d4e;
  }
  tbody tr {
    border-bottom: 1px solid #1e1e3a;
    transition: background var(--motion-duration-fast, 0.15s) var(--motion-ease, ease);
  }
  tbody tr:hover { background: #16213e; }
  tbody td {
    padding: 7px 12px;
    color: #cbd5e1;
    white-space: nowrap;
  }
  td.pid { color: #94a3b8; }
  td.mem { color: #f59e0b; }
  td.status { color: #22c55e; }
  #loading-row td {
    color: #94a3b8;
    text-align: center;
    padding: 24px;
    font-style: italic;
  }
  .empty-state {
    text-align: center;
    padding: 32px 16px;
    border: 1px dashed #2d2d4e;
    border-radius: 8px;
    background: #161b22;
  }
  .empty-state-icon {
    font-size: 28px;
    color: #a371f7;
    line-height: 1;
    margin-bottom: 12px;
  }
  .empty-state-title {
    font-size: 14px;
    color: #e2e8f0;
    margin-bottom: 8px;
    letter-spacing: 0.04em;
  }
  .empty-state-body {
    font-size: 12px;
    color: #94a3b8;
    margin-bottom: 16px;
    max-width: 28rem;
    margin-left: auto;
    margin-right: auto;
    line-height: 1.5;
  }
  .empty-state-cta {
    display: inline-block;
    padding: 8px 14px;
    border-radius: 4px;
    background: #22c55e;
    color: #0a0d12;
    font-size: 12px;
    font-weight: 600;
    text-decoration: none;
    letter-spacing: 0.02em;
  }
  .empty-state-cta:hover,
  .empty-state-cta:focus {
    background: #3fb950;
    outline: 2px solid #a78bfa;
    outline-offset: 2px;
  }
  .error-state {
    text-align: center;
    padding: 32px 16px;
    border: 1px dashed #ef4444;
    border-radius: 8px;
    background: #1c1017;
  }
  .error-state-icon {
    font-size: 28px;
    color: #ef4444;
    line-height: 1;
    margin-bottom: 12px;
  }
  .error-state-title {
    font-size: 14px;
    color: #fca5a5;
    margin-bottom: 8px;
    letter-spacing: 0.04em;
  }
  .error-state-body {
    font-size: 12px;
    color: #94a3b8;
    margin-bottom: 16px;
    max-width: 28rem;
    margin-left: auto;
    margin-right: auto;
    line-height: 1.5;
  }
  .error-state-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    align-items: center;
  }
  .error-state-cta {
    display: inline-block;
    padding: 8px 14px;
    border-radius: 4px;
    background: #a371f7;
    color: #0a0d12;
    font-size: 12px;
    font-weight: 600;
    text-decoration: none;
    letter-spacing: 0.02em;
    border: none;
    cursor: pointer;
    font-family: inherit;
  }
  .error-state-cta:hover,
  .error-state-cta:focus {
    background: #a78bfa;
    outline: 2px solid #fca5a5;
    outline-offset: 2px;
  }
  .error-state-hint {
    font-size: 11px;
    color: #64748b;
    font-family: inherit;
  }
  #last-update {
    margin-top: 12px;
    font-size: 11px;
    color: #4a5568;
  }
  #thermal-status {
    margin-left: auto;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 4px;
    background: #16213e;
    color: #22c55e;
    border: 1px solid #22c55e;
    transition: color var(--motion-duration, 0.3s), border-color var(--motion-duration, 0.3s), background var(--motion-duration, 0.3s);
  }
  #thermal-status.warning {
    color: #f59e0b;
    border-color: #f59e0b;
  }
  #thermal-status.critical {
    color: #ef4444;
    border-color: #ef4444;
    animation: pulse 1s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.5; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
    #thermal-status.critical { animation: none; }
  }
  .skip-link {
    position: absolute;
    left: -9999px;
    top: auto;
    width: 1px;
    height: 1px;
    overflow: hidden;
  }
  .skip-link:focus {
    position: static;
    width: auto;
    height: auto;
    padding: 8px 12px;
    background: #16213e;
    color: #e2e8f0;
    outline: 2px solid #a78bfa;
  }
  /* Responsive breakpoints: 375 (phone) / 768 (tablet) / 1280 (desktop default) */
  @media (max-width: 768px) {
    body { padding: 12px; font-size: 12px; }
    header { flex-wrap: wrap; gap: 8px; }
    #thermal-status { margin-left: 0; }
    tbody td { white-space: normal; }
    .empty-state { padding: 24px 12px; }
  }
  @media (max-width: 375px) {
    body { padding: 8px; font-size: 11px; }
    h1 { font-size: 15px; }
    thead th { padding: 6px 8px; }
    tbody td { padding: 5px 8px; }
  }
</style>
</head>
<body>
<a class="skip-link" href="#main-content">Skip to process table</a>

<nav aria-label="Dashboard status">
  <header>
    <div id="status-dot" role="status" aria-hidden="true"></div>
    <h1 id="dashboard-title">sharecli</h1>
    <span id="status-label" aria-live="polite">connecting...</span>
    <span id="thermal-status" role="status" aria-live="polite">&#x1F321; Normal</span>
  </header>
</nav>

<main id="main-content" tabindex="-1" aria-labelledby="dashboard-title">
<section id="operator-panels" aria-label="Operator status" data-operator-panels>
  <div class="operator-panel" id="panel-gate" aria-labelledby="panel-gate-title">
    <h2 id="panel-gate-title">Thermal gate</h2>
    <dl>
      <dt>Pressure</dt><dd id="gate-pressure">—</dd>
      <dt>Decision</dt><dd id="gate-decision" class="gate-unavailable">—</dd>
      <dt>Agents</dt><dd id="gate-agents">—</dd>
      <dt>Contention</dt><dd id="gate-contention">—</dd>
    </dl>
  </div>
  <div class="operator-panel" id="panel-host-watch" aria-labelledby="panel-host-title">
    <h2 id="panel-host-title">Host watch</h2>
    <dl>
      <dt>FDs</dt><dd id="host-fds">—</dd>
      <dt>RSS</dt><dd id="host-rss">—</dd>
      <dt>Load 1m</dt><dd id="host-load">—</dd>
      <dt>Net RX/TX</dt><dd id="host-net">—</dd>
    </dl>
  </div>
  <div class="operator-panel" id="panel-agents" aria-labelledby="panel-agents-title">
    <h2 id="panel-agents-title">Host agents</h2>
    <dl>
      <dt>Scanned</dt><dd id="agents-scanned">—</dd>
      <dt>Watched</dt><dd id="agents-watched">—</dd>
      <dt>Total RSS</dt><dd id="agents-rss">—</dd>
    </dl>
    <div class="families-list" id="agents-families" aria-live="polite">—</div>
  </div>
</section>
<table aria-label="Managed processes">
  <thead>
    <tr>
      <th scope="col">Name</th>
      <th scope="col">PID</th>
      <th scope="col">Memory MB</th>
      <th scope="col">Project</th>
      <th scope="col">Status</th>
    </tr>
  </thead>
  <tbody id="proc-body">
    <tr id="loading-row"><td colspan="5">waiting for data...</td></tr>
  </tbody>
</table>
<div id="last-update" aria-live="polite"></div>
</main>

<script>
  const dot = document.getElementById('status-dot');
  const label = document.getElementById('status-label');
  const body = document.getElementById('proc-body');
  const lastUpdate = document.getElementById('last-update');
  let reconnectTimer = null;
  let hadProcesses = false;
  let disconnectShown = false;
  const traceparent = document.documentElement.dataset.traceparent || '';

  const EMPTY_STATES = {
    'first-run': {
      title: 'No processes yet',
      body: 'Start your first harness to see live status in this table.',
      cta: 'sharecli start &lt;project&gt; &lt;harness&gt;',
      href: 'https://github.com/KooshaPari/sharecli#quick-start',
    },
    cleared: {
      title: 'All processes stopped',
      body: 'Processes were running earlier but the pool is empty now.',
      cta: 'sharecli ps',
      href: '#main-content',
    },
  };

  function traceHeaders() {
    const headers = {};
    if (traceparent) {
      headers['traceparent'] = traceparent;
    }
    return headers;
  }

  async function probeServe() {
    if (!traceparent) return;
    try {
      await fetch('/healthz', { headers: traceHeaders() });
    } catch (_) {}
  }

  function connect() {
    const ws = new WebSocket('ws://localhost:9000/ws');

    ws.onopen = () => {
      dot.classList.add('connected');
      label.textContent = 'connected';
      disconnectShown = false;
      if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    };

    ws.onmessage = (evt) => {
      let data;
      try { data = JSON.parse(evt.data); } catch { return; }
      if (data.event === 'thermal_warning') {
        setThermal('warning', '⚠️ Warning');
        return;
      }
      if (data.event === 'thermal_critical') {
        setThermal('critical', '🔴 Critical');
        return;
      }
      if (data.gate || data.host_watch || data.agents) {
        renderOperatorPanels(data);
      }
      const procs = Array.isArray(data.processes) ? data.processes : [];
      renderTable(procs);
      lastUpdate.textContent = 'last update: ' + new Date().toLocaleTimeString();
    };

    ws.onclose = ws.onerror = () => {
      dot.classList.remove('connected');
      label.textContent = 'disconnected — reconnecting in 3s';
      renderDisconnectError();
      if (!reconnectTimer) {
        reconnectTimer = setTimeout(() => { reconnectTimer = null; connect(); }, 3000);
      }
    };
  }

  function renderDisconnectError() {
    if (disconnectShown) return;
    disconnectShown = true;
    body.innerHTML = `<tr><td colspan="5">
      <div class="error-state" role="alert" data-error-kind="disconnect" aria-live="assertive">
        <div class="error-state-icon" aria-hidden="true">&#x26A0;</div>
        <div class="error-state-title">Dashboard disconnected</div>
        <p class="error-state-body">
          Cannot reach the WebSocket feed. Confirm <code>sharecli serve</code> is running on this host.
        </p>
        <div class="error-state-actions">
          <button type="button" class="error-state-cta" id="error-retry">Retry now</button>
          <code class="error-state-hint">sharecli serve --bind 127.0.0.1:9000</code>
        </div>
      </div>
    </td></tr>`;
    const retry = document.getElementById('error-retry');
    if (retry) {
      retry.addEventListener('click', () => {
        if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
        disconnectShown = false;
        connect();
      });
    }
  }

  function renderEmptyState(kind) {
    const spec = EMPTY_STATES[kind] || EMPTY_STATES['first-run'];
    body.innerHTML = `<tr><td colspan="5">
      <div class="empty-state" role="status" data-empty-kind="${kind}" aria-live="polite">
        <div class="empty-state-icon" aria-hidden="true">&#x25C8;</div>
        <div class="empty-state-title">${spec.title}</div>
        <p class="empty-state-body">${spec.body}</p>
        <code class="empty-state-cta" role="button" tabindex="0">${spec.cta}</code>
      </div>
    </td></tr>`;
  }

  function renderTable(procs) {
    if (procs.length === 0) {
      const kind = hadProcesses ? 'cleared' : 'first-run';
      renderEmptyState(kind);
      return;
    }
    hadProcesses = true;
    body.innerHTML = procs.map(p => {
      const name    = esc(p.name    ?? '—');
      const pid     = esc(String(p.pid ?? '—'));
      const mem     = p.memory_mb != null ? Number(p.memory_mb).toFixed(1) : '—';
      const project = esc(p.project ?? '—');
      const status  = 'running';
      return `<tr>
        <td>${name}</td>
        <td class="pid">${pid}</td>
        <td class="mem">${mem}</td>
        <td>${project}</td>
        <td class="status">${status}</td>
      </tr>`;
    }).join('');
  }

  const thermalEl = document.getElementById('thermal-status');

  function formatBytes(n) {
    if (n == null || Number.isNaN(Number(n))) return '—';
    const v = Number(n);
    if (v < 1024) return v + ' B';
    if (v < 1024 * 1024) return (v / 1024).toFixed(1) + ' KiB';
    if (v < 1024 * 1024 * 1024) return (v / (1024 * 1024)).toFixed(1) + ' MiB';
    return (v / (1024 * 1024 * 1024)).toFixed(2) + ' GiB';
  }

  function renderOperatorPanels(data) {
    const gate = data.gate || {};
    const host = data.host_watch || {};
    const agents = data.agents || {};

    const pressure = gate.thermal_pressure ?? '—';
    document.getElementById('gate-pressure').textContent = pressure;
    const decisionEl = document.getElementById('gate-decision');
    const decision = gate.gate_decision ?? '—';
    decisionEl.textContent = decision;
    decisionEl.className = decision === 'ADMIT' ? 'gate-admit'
      : decision === 'DENY' ? 'gate-deny' : 'gate-unavailable';
    document.getElementById('gate-agents').textContent =
      gate.detected_agents != null ? String(gate.detected_agents) : '—';
    document.getElementById('gate-contention').textContent = gate.agent_contention ?? '—';

    document.getElementById('host-fds').textContent =
      host.fd_count != null ? String(host.fd_count) : '—';
    document.getElementById('host-rss').textContent = formatBytes(host.mem_rss_bytes);
    document.getElementById('host-load').textContent =
      host.load_1m != null ? Number(host.load_1m).toFixed(2) : '—';
    const rx = host.net_rx_bytes != null ? formatBytes(host.net_rx_bytes) : '—';
    const tx = host.net_tx_bytes != null ? formatBytes(host.net_tx_bytes) : '—';
    document.getElementById('host-net').textContent = rx + ' / ' + tx;

    document.getElementById('agents-scanned').textContent =
      agents.scanned != null ? String(agents.scanned) : '—';
    document.getElementById('agents-watched').textContent =
      agents.watched != null ? String(agents.watched) : '—';
    document.getElementById('agents-rss').textContent = formatBytes(agents.total_rss_bytes);

    const families = agents.families || {};
    const famKeys = Object.keys(families);
    document.getElementById('agents-families').textContent = famKeys.length
      ? famKeys.map(k => k + ':' + families[k]).join(' · ')
      : 'no families';

    if (pressure === 'GREEN') setThermal('', 'Normal');
    else if (pressure === 'YELLOW') setThermal('warning', 'Warning');
    else if (pressure === 'RED') setThermal('critical', 'Critical');
    else if (pressure === 'UNAVAILABLE') setThermal('warning', 'Unavailable');
  }

  function setThermal(cls, text) {
    thermalEl.className = cls;
    thermalEl.textContent = text;
  }

  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  connect();
  probeServe();
</script>
</body>
</html>
