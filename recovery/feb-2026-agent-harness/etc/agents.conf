# =============================================================================
# agent-harness agents.conf — AI agent process name patterns
#
# Each line is a substring matched against process names (comm) and full
# command lines (cmdline) in the parent process tree.  If any ancestor
# process matches, the command is treated as agent-initiated.
#
# Matching is substring-based and case-sensitive.
# Lines starting with # are comments.  Blank lines are ignored.
# =============================================================================

# ── Anthropic ────────────────────────────────────────────────────────────────
claude

# ── Cursor ───────────────────────────────────────────────────────────────────
cursor

# ── Augment / Auggie ─────────────────────────────────────────────────────────
augment
auggie

# ── Aider ────────────────────────────────────────────────────────────────────
aider

# ── GitHub Copilot ───────────────────────────────────────────────────────────
copilot

# ── Windsurf / Codeium ───────────────────────────────────────────────────────
windsurf
codeium

# ── Sourcegraph Cody ─────────────────────────────────────────────────────────
cody

# ── Amazon CodeWhisperer / Q ─────────────────────────────────────────────────
codewhisperer
amazon-q

# ── Devin ────────────────────────────────────────────────────────────────────
devin

# ── Codex CLI ────────────────────────────────────────────────────────────────
codex

# ── Generic patterns (catch spawned node/python agent workers) ───────────────
# Uncomment these if your agents spawn generic interpreters that you want
# to catch.  Be cautious — this can intercept non-agent processes.
# node --agent
# python -m agent
