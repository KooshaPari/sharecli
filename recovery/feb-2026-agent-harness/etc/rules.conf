# =============================================================================
# agent-harness rules.conf — Command strategy definitions
#
# FORMAT:
#   COMMAND[:SUBCOMMAND]  STRATEGY  [key=value ...]
#
# STRATEGIES:
#   passthrough   — Direct exec, no interception (use for mutating or
#                   interactive commands, or when you want zero overhead)
#   coalesce      — Single-flight with caching. Only one process runs at a
#                   time; concurrent arrivals get the cached result. Best for
#                   read-only lint/check commands.
#   queue         — Concurrency limiter with priority. Allows up to max_concurrent
#                   parallel executions. Higher priority commands execute first.
#   priority_queue — Alias for queue (explicit about priority support)
#   debounce      — Adds a delay before execution (no caching). Absorbs
#                   rapid-fire calls without deduplicating results.
#
# OPTIONS:
#   ttl=N           Cache lifetime in seconds (coalesce only)      [default: 10]
#   stale=N         Stale-while-revalidate threshold in seconds    [default: 0]
#                    When age > stale but < ttl, serve cached result AND
#                    trigger background refresh. Great for frequently-accessed
#                    commands where you want instant response but fresh data.
#   error_ttl=N     Cache lifetime for non-zero exits              [default: =ttl]
#   debounce_ms=N   Delay in milliseconds before executing         [default: 0]
#   max_concurrent=N  Max parallel executions (queue only)         [default: 1]
#   priority=LEVEL  Queue priority: critical, high, normal, low, background
#                    Higher priority commands execute first when contending
#                    for queue slots. Aging prevents starvation.   [default: normal]
#   cache_key=MODE  Cache key mode: "time", "git", or "args"      [default: time]
#                    - time: command + args + CWD (TTL-based expiry)
#                    - git:  command + args + CWD + git working tree state
#                    - args: command + args only (CWD-independent)
#   semantic=1      Enable semantic coalescing — normalizes paths so
#                    "ruff check ." and "ruff check src/" can share cache
#                    when semantically equivalent                  [default: 0]
#   nocache_args=X,Y  Comma-separated flags that bypass cache     [default: ""]
#                     If any of these flags appear in the command args,
#                     strategy falls back to "queue" instead of coalesce.
#   readcache=N       File read cache level before exec              [default: 1]
#                     0 = off, 1 = page cache warm, 2 = warm + stat shim, 3 = ramdisk
#
# MATCHING:
#   - Exact match (ruff:check) takes priority over wildcard (ruff:*)
#   - Wildcard (ruff or ruff:*) matches any subcommand
#   - Subcommand is the first non-flag argument
#   - Commands not listed here are passed through without interception
#
# =============================================================================

# ── Python linting / formatting ──────────────────────────────────────────────
# Using stale=5 means: serve cache immediately, but refresh in background if > 5s old
# Using semantic=1 means: "ruff check ." and "ruff check src/" can share cache if equivalent
ruff:check          coalesce    ttl=15  stale=5  cache_key=git  debounce_ms=150  semantic=1  nocache_args=--fix,--unsafe-fixes
ruff:format         queue       max_concurrent=1  priority=normal
ruff                coalesce    ttl=15  stale=5  cache_key=git  debounce_ms=150  semantic=1

mypy                coalesce    ttl=30  stale=10  cache_key=git  debounce_ms=300  semantic=1
pylint              coalesce    ttl=20  stale=8   cache_key=git  debounce_ms=200  semantic=1
flake8              coalesce    ttl=15  stale=5   cache_key=git  semantic=1
black:--check       coalesce    ttl=15  stale=5   cache_key=git
black               queue       max_concurrent=1
isort:--check-only  coalesce    ttl=15  cache_key=git
isort               queue       max_concurrent=1

# ── JavaScript / TypeScript ──────────────────────────────────────────────────
eslint              coalesce    ttl=15  cache_key=git  debounce_ms=200  nocache_args=--fix
prettier:--check    coalesce    ttl=15  cache_key=git
prettier            queue       max_concurrent=1
tsc                 coalesce    ttl=20  cache_key=git  debounce_ms=300

# ── Go ───────────────────────────────────────────────────────────────────────
# NOTE: Go tools are fast; you may prefer passthrough for small projects.
golangci-lint       coalesce    ttl=20  cache_key=git  debounce_ms=200
go:vet              coalesce    ttl=15  cache_key=git
gofmt               queue       max_concurrent=1

# ── Rust ─────────────────────────────────────────────────────────────────────
cargo:check         coalesce    ttl=30  cache_key=git  debounce_ms=500
cargo:clippy        coalesce    ttl=30  cache_key=git  debounce_ms=500
cargo:fmt           queue       max_concurrent=1

# ── npm / package managers ───────────────────────────────────────────────────
# "npm run lint", "npm run check", etc. — coalesce the check variants
npm:run             coalesce    ttl=15  debounce_ms=300
npx                 coalesce    ttl=10  debounce_ms=200
pnpm:run            coalesce    ttl=15  debounce_ms=300

# ── General-purpose ──────────────────────────────────────────────────────────
make:lint           coalesce    ttl=15  debounce_ms=200
make:check          coalesce    ttl=15  debounce_ms=200
make                passthrough

# ── Testing (lower priority - can wait while lint/check runs) ──────────────────
pytest              queue       max_concurrent=2  priority=low
jest                queue       max_concurrent=2  priority=low
go:test             queue       max_concurrent=2  priority=low
cargo:test          queue       max_concurrent=1  priority=low

# ═══════════════════════════════════════════════════════════════════════════════
# FILE-MUTATING TOOLS (Tier 1)
#
# These tools modify files directly. We use the queue strategy to serialize
# concurrent invocations and prevent race conditions. Unlike lint/check commands,
# these should NEVER be cached since they have side effects.
# ═══════════════════════════════════════════════════════════════════════════════

# ── Text manipulation ────────────────────────────────────────────────────────
# sed: Stream editor - commonly used for in-place file modifications
sed                 queue       max_concurrent=1

# awk: Pattern scanning and processing - rarely mutates but can with -i
awk                 passthrough

# ── Patch tools ──────────────────────────────────────────────────────────────
# patch: Apply diff files to originals
patch               queue       max_concurrent=1

# diff: Generate diffs (read-only, safe to run concurrently)
diff                passthrough

# ── Git file operations ──────────────────────────────────────────────────────
# Git operations are prioritized high since they often block other work
# git apply: Apply patches to files
git:apply           queue       max_concurrent=1  priority=high

# git checkout: Can modify working tree files
git:checkout        queue       max_concurrent=1  priority=high

# git stash: Modifies working tree
git:stash           queue       max_concurrent=1  priority=high

# git reset: Can modify working tree (especially --hard)
git:reset           queue       max_concurrent=1  priority=critical

# git merge: Modifies files during merge
git:merge           queue       max_concurrent=1  priority=high

# git rebase: Modifies files during rebase
git:rebase          queue       max_concurrent=1  priority=high

# git cherry-pick: Modifies files
git:cherry-pick     queue       max_concurrent=1  priority=high

# git revert: Modifies files
git:revert          queue       max_concurrent=1  priority=high

# Read-only git operations are safe - use stale-while-revalidate for better latency
git:status          coalesce    ttl=5   stale=2  cache_key=git  priority=high
git:diff            coalesce    ttl=5   stale=2  cache_key=git
git:log             coalesce    ttl=10  stale=5  cache_key=git
git:branch          coalesce    ttl=10  stale=5
git:remote          coalesce    ttl=30  stale=15
git:show            coalesce    ttl=10  stale=5  cache_key=git

# ── File copy/move ───────────────────────────────────────────────────────────
# cp/mv: File operations - dangerous to run concurrently on same targets
cp                  queue       max_concurrent=2
mv                  queue       max_concurrent=1
rm                  queue       max_concurrent=1

# ── Code generation / scaffolding ────────────────────────────────────────────
# These often create or modify multiple files
cookiecutter        queue       max_concurrent=1
yeoman              queue       max_concurrent=1
plop                queue       max_concurrent=1

# ── Database migrations ──────────────────────────────────────────────────────
# Alembic (Python SQLAlchemy migrations)
alembic:upgrade     queue       max_concurrent=1
alembic:downgrade   queue       max_concurrent=1
alembic             passthrough

# Django migrations
python:manage.py    passthrough  # Too variable to proxy effectively

# Prisma (Node.js ORM)
prisma:migrate      queue       max_concurrent=1
prisma:generate     queue       max_concurrent=1
prisma              passthrough
