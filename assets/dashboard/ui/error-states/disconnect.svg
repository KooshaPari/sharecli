<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" role="img" aria-label="Dashboard feed disconnected">
  <!--
    C10 L101 - tier-1 hand-authored disconnect illustration (Backbone-2 tokens).
    Depicts serve -> dashboard WebSocket feed severed - not abstract decoration.
    Provenance: docs/visual/PROVENANCE.md (tier 1, repo license).
  -->
  <defs>
    <linearGradient id="bb2-ground" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d12"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="bb2-error-glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#f85149" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#f85149" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Panel ground -->
  <rect width="100%" height="100%" fill="url(#bb2-ground)" rx="16"/>
  <rect x="0" y="0" width="480" height="4" fill="#f85149"/>

  <!-- Soft error glow behind break -->
  <ellipse cx="240" cy="150" rx="110" ry="58" fill="url(#bb2-error-glow)"/>

  <!-- Left: sharecli serve node -->
  <g id="serve-node">
    <rect x="48" y="96" width="120" height="108" rx="12" fill="#0a0d12" stroke="#2d333b" stroke-width="2"/>
    <rect x="60" y="110" width="96" height="10" rx="3" fill="#3fb950" opacity="0.85"/>
    <rect x="60" y="130" width="72" height="6" rx="2" fill="#94a3b8" opacity="0.55"/>
    <rect x="60" y="144" width="88" height="6" rx="2" fill="#94a3b8" opacity="0.35"/>
    <rect x="60" y="158" width="56" height="6" rx="2" fill="#94a3b8" opacity="0.25"/>
    <circle cx="168" cy="150" r="7" fill="#3fb950"/>
    <text x="108" y="228" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">serve :9000</text>
  </g>

  <!-- Right: dashboard client node -->
  <g id="dashboard-node">
    <rect x="312" y="96" width="120" height="108" rx="12" fill="#0a0d12" stroke="#2d333b" stroke-width="2"/>
    <!-- Mini process-table silhouette -->
    <rect x="324" y="112" width="96" height="8" rx="2" fill="#64748b" opacity="0.7"/>
    <rect x="324" y="128" width="96" height="6" rx="2" fill="#2d333b"/>
    <rect x="324" y="140" width="96" height="6" rx="2" fill="#2d333b"/>
    <rect x="324" y="152" width="96" height="6" rx="2" fill="#2d333b"/>
    <rect x="324" y="164" width="64" height="6" rx="2" fill="#2d333b"/>
    <circle cx="312" cy="150" r="7" fill="#f85149"/>
    <text x="372" y="228" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">dashboard</text>
  </g>

  <!-- Severed WebSocket link (left stub) -->
  <path d="M175 150 H210" fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round"/>
  <path d="M210 150 L222 142 M210 150 L222 158" fill="none" stroke="#3fb950" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Severed WebSocket link (right stub) -->
  <path d="M270 150 H305" fill="none" stroke="#f85149" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 5"/>
  <path d="M270 150 L258 142 M270 150 L258 158" fill="none" stroke="#f85149" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Break marker -->
  <g id="break" filter="url(#soft)">
    <circle cx="240" cy="150" r="18" fill="#0a0d12" stroke="#f85149" stroke-width="2.5"/>
    <path d="M231 141 L249 159 M249 141 L231 159" fill="none" stroke="#f85149" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Caption -->
  <text x="240" y="268" text-anchor="middle" fill="#f85149" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">Feed disconnected</text>
  <text x="240" y="294" text-anchor="middle" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">WebSocket to sharecli serve is down</text>
</svg>
