openapi: 3.0.3
info:
  title: sharecli serve
  description: |
    Minimal OpenAPI stub for the `sharecli serve` HTTP surface.
    Paths mirror `src/commands/serve.rs` (liveness, readiness, Prometheus, config).
    JSON errors use `ErrorEnvelope` (`src/error_envelope.rs`, `docs/ops/error-envelope.md`).
  version: 0.3.0
servers:
  - url: http://127.0.0.1:9000
    description: Default local bind (`sharecli serve --bind 127.0.0.1:9000`)
paths:
  /:
    get:
      operationId: dashboard
      summary: Embedded HTML dashboard
      description: |
        Serves `src/dashboard.html` (process table + thermal status over WebSocket).
        UI surface — not a JSON API.
      responses:
        "200":
          description: HTML dashboard
          content:
            text/html:
              schema:
                type: string
  /assets/dashboard/ui/{*path}:
    get:
      operationId: dashboardAsset
      summary: Embedded dashboard UI asset
      description: |
        Serves an embedded dashboard favicon, banner, icon, or empty-state asset.
        Unknown asset paths return 404.
      parameters:
        - name: path
          in: path
          required: true
          description: Relative path below `assets/dashboard/ui/`.
          schema:
            type: string
      responses:
        "200":
          description: Embedded dashboard asset
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: Asset not found
  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe
      description: Always returns 200 while the process is up.
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOk"
              example:
                status: ok
  /readyz:
    get:
      operationId: readyz
      summary: Readiness probe
      description: |
        Returns 200 while serving; 503 once shutdown has been requested
        (Ctrl-C or thermal critical).
      responses:
        "200":
          description: Ready to accept traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOk"
              example:
                status: ok
        "503":
          description: Shutdown requested; not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusUnavailable"
              example:
                status: unavailable
  /health/processes:
    get:
      operationId: healthProcesses
      summary: Process health snapshot
      description: |
        Returns health status for monitored processes (JSON).
        Bearer required when AuthN is enabled.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Process health list
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          $ref: "#/components/responses/Unauthorized"
  /metrics/prometheus:
    get:
      operationId: metricsPrometheus
      summary: Prometheus text metrics
      description: |
        Prometheus exposition format (`text/plain; version=0.0.4`) for
        tracked process gauges plus HTTP RED series
        (`sharecli_http_requests_total`, `sharecli_http_errors_total`,
        `sharecli_http_request_duration_ms_*`).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Traceparent"
      responses:
        "200":
          description: Metrics payload
          headers:
            traceparent:
              schema:
                type: string
              description: W3C trace context (echoed or synthesized)
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # HELP sharecli_process_memory_mb Resident memory usage in MiB per process
                  # TYPE sharecli_process_memory_mb gauge
                  # HELP sharecli_http_requests_total Total HTTP requests handled by sharecli serve
                  # TYPE sharecli_http_requests_total counter
                  sharecli_http_requests_total 0
        "401":
          $ref: "#/components/responses/Unauthorized"
  /debug/pprof/profile:
    get:
      operationId: pprofProfile
      summary: CPU pprof protobuf sample (opt-in)
      description: |
        Continuous-profiling surface (audit-v38 L45). Requires `SHARECLI_PPROF=1`.
        Unix builds return Google profile.proto bytes; Windows returns 501 (use samply/perf).
        Not a public path — Bearer required when AuthN is enabled.
      security:
        - bearerAuth: []
      parameters:
        - name: seconds
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 60
            default: 10
          description: Capture window in seconds (capped at 60).
        - $ref: "#/components/parameters/Traceparent"
      responses:
        "200":
          description: pprof protobuf profile
          content:
            application/vnd.google.protobuf:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "501":
          $ref: "#/components/responses/NotImplemented"
  /config:
    get:
      operationId: getConfig
      summary: Live configuration snapshot
      description: |
        Returns the current in-memory config as JSON (last successful
        hot-reload of `~/.config/sharecli/config.toml`).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current config object
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                description: Serialized `Config` (projects, runtime, pool, monitoring, …)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /ws:
    get:
      operationId: websocketProcessStream
      summary: Process snapshot WebSocket
      description: |
        Upgrades to WebSocket and streams periodic ProcessSummary JSON snapshots
        (and thermal warning/critical events) for the dashboard.
      security:
        - bearerAuth: []
      responses:
        "101":
          description: Switching Protocols (WebSocket)
        "400":
          description: Not a WebSocket upgrade request
        "401":
          $ref: "#/components/responses/Unauthorized"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Optional. When `SHARECLI_SERVE_TOKEN` (or `config.serve.bearer_token`) is
        set, required on all paths except `/healthz` and `/readyz`.
  parameters:
    Traceparent:
      name: traceparent
      in: header
      required: false
      schema:
        type: string
        example: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
      description: W3C Trace Context; extracted into the `http.request` span and echoed on the response.
  responses:
    Unauthorized:
      description: Bearer AuthN failure (when `SHARECLI_SERVE_TOKEN` or `config.serve.bearer_token` is set)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              type: authentication_error
              code: unauthorized
              message: missing or invalid bearer token
              request_id: null
    NotFound:
      description: Resource not found or feature disabled
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              type: not_found_error
              code: not_found
              message: profiling disabled; set SHARECLI_PPROF=1 to enable
              request_id: null
    InternalError:
      description: Internal server error (no internal details leaked)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              type: internal_error
              code: internal_server_error
              message: an internal error occurred
              request_id: null
    NotImplemented:
      description: Platform or build does not implement this handler
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            error:
              type: not_implemented_error
              code: not_implemented
              message: CPU profiling via pprof is Unix-only on this build; use samply/perf externally (see docs/ops/profiling.md)
              request_id: null
  schemas:
    StatusOk:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    StatusUnavailable:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [unavailable]
    ErrorEnvelope:
      type: object
      description: |
        Unified JSON error wire shape for `sharecli serve` (`src/error_envelope.rs`).
        Probe routes (`/healthz`, `/readyz`) intentionally use bare `{ "status": ... }`.
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
    ErrorBody:
      type: object
      description: Nested error payload inside `ErrorEnvelope`.
      required: [type, code, message, request_id]
      properties:
        type:
          type: string
          description: Stable machine class (`authentication_error`, `validation_error`, …)
          enum:
            - authentication_error
            - validation_error
            - not_found_error
            - not_implemented_error
            - internal_error
        code:
          type: string
          description: Stable snake_case code (`unauthorized`, `not_found`, …)
        message:
          type: string
          description: Human-readable English message (ADR-0003)
        request_id:
          type: string
          nullable: true
          description: Optional request correlation id (null until middleware lands)
