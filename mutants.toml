# cargo-mutants config — C07 L65 (hard CI gate + local smoke)
# Focus on pure TUI transforms so mutants finish quickly.
# Hard gate live (T-640): docs/ops/mutants-hard-gate.md
# Threshold contract: docs/ops/mutants-threshold.md

test_timeout = 60
jobs = 2

# Examine only the thermal-tui pure helpers first.
examine_re = [
  "crates/sharecli-thermal-tui/src/lib.rs",
]

# Skip render/event-loop noise that needs a terminal.
exclude_re = [
  "fn render",
  "fn event_loop",
  "fn run",
  "fn count_cargo_builds",
]
